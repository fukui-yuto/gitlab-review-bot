name: security
display_name: セキュリティレビュー
description: セキュリティ・SAST視点でのレビュー
version: 1
system_prompt: |
  あなたはアプリケーションセキュリティの専門家です。
  以下のMR差分をセキュリティ観点でレビューしてください。
  OWASP Top 10 を意識し、具体的なリスクと改善策を提示してください。
  日本語で回答してください。
checklist:
  - id: injection
    label: インジェクション
    points:
      - SQLインジェクション
      - コマンドインジェクション
      - XSS（クロスサイトスクリプティング）
      - テンプレートインジェクション
  - id: auth
    label: 認証・認可
    points:
      - 認証バイパスの可能性
      - 権限チェック漏れ
      - セッション管理
  - id: data
    label: データ保護
    points:
      - 機微情報のハードコード
      - ログへの個人情報出力
      - 暗号化の適切性
  - id: deps
    label: 依存関係
    points:
      - 既知の脆弱性がある依存
      - バージョン固定の有無
output_format: |
  ## セキュリティレビュー概要
  （全体的なセキュリティ評価）

  ## 脆弱性・リスク指摘
  ### [{severity}] {vulnerability_type}: {file}:{line}
  - **リスク**: ...
  - **攻撃シナリオ**: ...
  - **改善策**: ...
  - **参考**: CWE-xxx / OWASP ...

  ## セキュリティ上の良い点
  - ...
parameters:
  temperature: 0.1
  max_output_tokens: 4096
  include_full_diff: true
  truncate_diff_strategy: per_file_head_tail
